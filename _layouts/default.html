<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    {% seo %}

    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
      .wrapper {
        max-width: 760px;
        width: auto;
        margin: 0 auto;
        padding: 40px 24px;
      }

      header,
      footer {
        display: none;
      }

      section {
        float: none;
        width: auto;
        border: 0;
        padding: 0;
        margin: 0;
      }

      .site-nav {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 32px;
        padding-bottom: 18px;
        border-bottom: 1px solid #e5e5e5;
      }

      .site-nav a {
        color: #267cb9;
        font-weight: 600;
        text-decoration: none;
        padding: 6px 8px;
      }

      .site-nav a:hover,
      .site-nav a:focus {
        text-decoration: underline;
      }

      .research-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: 24px;
        align-items: start;
        margin: 32px 0;
        padding-bottom: 28px;
        border-bottom: 1px solid #e5e5e5;
      }

      .research-item:last-child {
        border-bottom: 0;
      }

      .research-item h2 {
        margin-top: 0;
      }

      .research-item p {
        text-align: justify;
      }

      .research-image {
        width: 100%;
        border: 1px solid #e5e5e5;
        border-radius: 6px;
      }

      .research-image-placeholder {
        min-height: 150px;
        border: 1px dashed #b8b8b8;
        border-radius: 6px;
        color: #666;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 16px;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      .contact-list {
        list-style: none;
        padding: 0;
        margin: 28px 0 0;
      }

      .contact-list li {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 22px;
      }

      .contact-icon {
        flex: 0 0 34px;
        width: 34px;
        height: 34px;
        object-fit: contain;
      }

      .contact-list p {
        margin: 0;
      }

      @media print, screen and (max-width: 960px) {
        .wrapper {
          width: auto;
          padding: 24px;
        }

        section {
          border: 0;
          padding: 0;
          margin: 0;
        }
      }

      @media print, screen and (max-width: 480px) {
        .wrapper {
          padding: 20px;
        }

        .research-item {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/CV.html' | relative_url }}">CV</a>
        <a href="{{ '/research.html' | relative_url }}">Research</a>
        <a href="{{ '/contact.html' | relative_url }}">Contact</a>
      </nav>
      <section>
        {{ content }}
      </section>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
